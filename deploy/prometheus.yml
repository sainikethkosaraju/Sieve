global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sieve
    metrics_path: /metrics
    # /metrics requires the API key unless metrics_public is true
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/sieve_api_key
    static_configs:
      - targets: ["sieve:8080"]
